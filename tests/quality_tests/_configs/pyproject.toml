
# ###################################################################
# pyright options:
# https://github.com/microsoft/pyright/blob/main/docs/configuration.md

[tool.pyright]
include = ["."]
ignore = ["**/typings"]
exclude = [".*", "__*", "**/typings"]

typeCheckingMode = "basic"
stubPath = "typings"
typeshedPath = "typings"
pythonVersion = "3.10"
pythonPlatform = "Linux"
useLibraryCodeForTypes = false

reportMissingModuleSource = "none"
reportUnnecessaryTypeIgnoreComment = "error"

# Assume legacy behavior where bytearray and memoryview are considered subtypes of bytes.
disableBytesTypePromotions = false
reportSelfClsParameterName = "warning"


# ###################################################################
# mypy global options:
[tool.mypy]
platform = "linux"
mypy_path = "typings"
custom_typeshed_dir = "typings" # allow mypy to use micropython-stdlib
files = "*.py"
exclude = [
    "typings[\\/].*", # TOML basic string 
]

follow_imports = "silent"
follow_imports_for_stubs = true
no_site_packages = true
check_untyped_defs = true
disable_error_code = ["no-redef", "assignment", "var-annotated"]

# snippets may re-use the same variable names
allow_redefinition = true

# other optional settings
warn_unused_ignores = true  # allows to verify the absense of methods/classes in stubs 
# warn_unused_configs = true
# show_error_context = true

# ###################################################################
# zuban options:
[tool.zuban]
mode = "default"
mypy_path = ["typings", "typings/stdlib"]
files = ["*.py"]
exclude = ["typings[\\/].*"]
platform = "linux"
python_version = "3.10"
follow_imports = "silent"
follow_imports_for_stubs = true
check_untyped_defs = true
allow_redefinition = true
warn_unused_ignores = true
disable_error_code = ["no-redef", "assignment", "var-annotated"]

# ###################################################################
# ruff options:
[tool.ruff]
line-length = 140
target-version = "py39"
builtins = ["ptr", "ptr8", "ptr16", "ptr32", "uint", "micropython", "const"]
extend-exclude = ["typings"]

[tool.ruff.lint]
extend-select = [
    "PYI", # flake8-pyi - stub file specific checks
]
extend-ignore = [
    "E401", # multiple imports
    "E402", # module level import not at top of file - common in test snippets

    "E711", # Comparison to `None` should be `cond is None`
    "E712", # Avoid equality comparisons to `True`; use `pull_up:` for truth checks
    "E713", # test for membership should be 'not in'
    "E721", # Use `is` and `is not` for type comparisons, or `isinstance()` for isinstance checks
    "E722", # Bare except
    "E731", # do not assign a lambda expression, use a def
    "E741", # Ambiguous variable name

    "F401", # unused import
    "F403", # import *
    "F405", # may be undefined, or defined from star imports
    "F541", # f-string without any placeholders

    "F701", # Multiple statements on one line ;
    "F702", # Multiple statements on one line :

    "F811", # redefenition
    "F821", # undefined name (can occur in stubs)
    "F841", # Local variable `foo` is assigned to but never used


    "PYI002",
    "PYI010",
    "PYI011", # Only simple default values allowed for typed arguments - we want actual defaults
    "PYI014", # Only simple default values allowed for arguments - we want actual defaults
    "PYI021", # Docstrings should not be included in stubs (but we want them for MicroPython)
    "PYI024",  # do not use collections.namedtuple
    "PYI029", # __str__ and __repr__ are useful in MicroPython stubs
    "PYI044", # `from __future__ import annotations` - used in generated stubs
    "PYI048", # Function body must contain exactly one statement - docstrings count
    "PYI052",

]
# ###################################################################
# pyrefly options:
[tool.pyrefly]
project-includes = ["**/*.py"]
project-excludes = ["**/typings/**", "**/__pycache__/**"]
search-path = ["typings"]
python-version = "3.10"
python-platform = "linux"
skip-interpreter-query = true
untyped-def-behavior = "check-and-infer-return-type"
permissive-ignores = true

# ###################################################################
# ty options:
[tool.ty.environment]
python-version = "3.10"
python-platform = "linux"
extra-paths = ["typings"]

[tool.ty.src]
exclude = ["**/typings/**", "**/__pycache__/**"]

[tool.ty.rules]
# `reveal_type` is a type-checker builtin for pyright/mypy, ty wants it imported
undefined-reveal = "ignore"
# the `# type: ignore` comments in the snippets target pyright/mypy, not ty
unused-type-ignore-comment = "ignore"
# MicroPython stubs mark port specific/legacy APIs as deprecated on purpose
deprecated = "ignore"
